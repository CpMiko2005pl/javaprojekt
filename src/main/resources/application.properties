# =====================================================================
#  Konfiguracja wspolna aplikacji "Gra o Przetrwanie" (szkielet)
# =====================================================================

spring.application.name=Politechnika-Monopoly

# ---------------------------------------------------------------------
#  WYBOR PROFILU BAZY DANYCH
# ---------------------------------------------------------------------
#  h2       -> baza w pamieci, ZERO konfiguracji - uruchamia sie od reki
#              (idealne na pierwsza prezentacje, zanim powstanie PostgreSQL)
#  postgres -> docelowa baza PostgreSQL (patrz application-postgres.properties)
#
#  Zmiana profilu:
#    - tutaj nizej (spring.profiles.active=postgres), albo
#    - przy starcie:  --spring.profiles.active=postgres
# ---------------------------------------------------------------------
spring.profiles.active=postgres

# Port HTTP — hosting (np. Render.com) wstrzykuje wlasny przez zmienna PORT
server.port=${PORT:8080}

# Pokazuj generowany SQL w konsoli (pomocne przy nauce / debugowaniu)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf - w developmencie wylaczamy cache, by od razu widziec zmiany w widokach
spring.thymeleaf.cache=false
