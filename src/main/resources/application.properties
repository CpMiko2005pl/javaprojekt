# =====================================================================
#  Konfiguracja wspolna aplikacji "Gra o Przetrwanie" (szkielet)
# =====================================================================

spring.application.name=Politechnika-Monopoly

# ---------------------------------------------------------------------
#  WYBOR PROFILU BAZY DANYCH
# ---------------------------------------------------------------------
#  localhost -> http://localhost:8080 + ta sama baza PostgreSQL co serwer LAN
#  lan       -> serwer 192.168.100.48 (tez PostgreSQL)
#  postgres  -> tylko ustawienia bazy (importowane przez localhost/lan)
#
#  Zmiana profilu:
#    - tutaj nizej (spring.profiles.active=localhost), albo
#    - przy starcie:  --spring.profiles.active=postgres
# ---------------------------------------------------------------------
spring.profiles.active=localhost

# Port HTTP — hosting (np. Render.com) wstrzykuje wlasny przez zmienna PORT
server.port=${PORT:8080}

# Pokazuj generowany SQL w konsoli (pomocne przy nauce / debugowaniu)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf - w developmencie wylaczamy cache, by od razu widziec zmiany w widokach
spring.thymeleaf.cache=false

# Statyczne pliki (JS/CSS) - bez cache w dev, zeby przegladarka nie trzymala starego board3d.js
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Upload awatarow i banerow w ustawieniach profilu
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
