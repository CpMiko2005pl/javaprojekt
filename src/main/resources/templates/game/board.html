<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Plansza')}"></head>
<body class="light-page board-page board-fullscreen">

<main id="main" class="board-fullscreen-main"
      th:attr="data-session=${sessionId},data-username=${#authentication.name},data-player-id=${myPlayerId}">

    <div class="canvas-shell board-canvas-shell bt-fullboard">
        <!-- Renderowanie Three.js -->
        <div id="game-canvas-container"></div>

        <!-- Loader -->
        <div id="game-canvas-loader" class="canvas-loader">
            <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:#ffd54f;margin-bottom:1rem;"></i>
            <span>Ladowanie planszy Kampus PB...</span>
        </div>

        <!-- Topbar -->
        <div class="bt-topbar-float">
            <div class="bt-topbar-left">
                <span class="board-topbar-brand">Politechnika Monopoly</span>
                <span class="board-topbar-room" th:text="${sessionName}">Pokoj</span>
                <span class="code-chip" th:text="${sessionCode}">ABC123</span>
                <span id="gameClock" class="hud-badge bt-clock" title="Czas do konca gry (po 60 min wygrywa najbogatszy)"></span>
                <span id="liveBadge" class="hud-badge bt-live">Laczenie...</span>
            </div>
            <div class="bt-topbar-right">
                <div class="bt-zoom-group">
                    <button type="button" id="zoom-in-btn" class="btn btn-bt btn-small" title="Przyblizenie">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                    </button>
                    <button type="button" id="zoom-out-btn" class="btn btn-bt btn-small" title="Oddalenie">
                        <i class="fa-solid fa-magnifying-glass-minus"></i>
                    </button>
                </div>
                <button type="button" id="themeToggle" class="btn btn-bt btn-small btn-theme-toggle"
                        title="Przelacz tryb nocny" aria-label="Tryb nocny" aria-pressed="false"
                        onclick="pbToggleTheme(this)">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
                <button type="button" id="leaveGameBtn" class="btn btn-danger btn-small">
                    <i class="fa-solid fa-right-from-bracket"></i> Opusc gre
                </button>
            </div>
        </div>

        <!-- Pasek graczy pod belka (nie nachodzi na topbar) -->
        <div id="cornerPlayers" class="bt-players-strip" aria-live="polite"></div>

        <!-- Dice badge -->
        <div id="diceBadge" class="bt-dice-badge" aria-hidden="true">
            <span class="bt-dice-badge-d" id="diceBadgeD1">-</span>
            <span class="bt-dice-badge-plus">+</span>
            <span class="bt-dice-badge-d" id="diceBadgeD2">-</span>
            <span class="bt-dice-badge-eq">=</span>
            <span class="bt-dice-badge-sum" id="diceBadgeSum">-</span>
        </div>

        <!-- Toast feed -->
        <div id="actionToasts" class="bt-toast-feed" aria-live="polite"></div>

        <!-- Tile info — maly badge u gory nad przyciskiem -->
        <div id="tileInfoPanel" class="bt-tile-info-float">
            <div id="tileInfo" class="log-box bt-log"></div>
        </div>

        <!-- Chance modal -->
        <div id="chanceModal" class="chance-modal" aria-hidden="true">
            <div class="chance-card">
                <div class="chance-kind" id="chanceKind">SZANSA - PB</div>
                <div class="chance-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <h3 class="chance-title" id="chanceTitle">Tytul karty</h3>
                <p class="chance-desc" id="chanceDesc">Opis efektu</p>
                <div class="chance-effect" id="chanceEffect">+0 PLN</div>
            </div>
        </div>

        <!-- Winner banner (maly, u gory) -->
        <div id="winnerBanner" class="bt-winner-float" style="display:none;"></div>

        <!-- Game-end overlay -->
        <div id="gameEndOverlay" style="display:none;position:fixed;inset:0;z-index:9999;
             background:rgba(0,0,0,.85);backdrop-filter:blur(6px);
             flex-direction:column;align-items:center;justify-content:center;
             gap:1.5rem;text-align:center;">
            <div id="gameEndIcon" style="font-size:5rem;"></div>
            <h1 id="gameEndTitle" style="font-size:2.5rem;margin:0;"></h1>
            <p id="gameEndSub" style="font-size:1.2rem;color:var(--slate-300);margin:0;"></p>
            <div id="gameEndTimer" style="font-size:1rem;color:var(--slate-400);"></div>
            <a href="/dashboard" class="btn btn-bt-roll" style="font-size:1.1rem;padding:.9rem 2.5rem;">
                <i class="fa-solid fa-house"></i> Wroc do profilu
            </a>
        </div>

        <!-- ===== FLOATING ACTION PANEL (zamiast side panelu) ===== -->
        <!-- Wyswietlany centralnie nad planszą gdy jest decyzja do podjecia -->
        <div id="actionPanel" class="bt-action-float" style="display:none;"></div>

        <!-- Leave game — pb-dialog.js -->

        <!-- ===== BOTTOM HUD ===== -->
        <div class="bt-bottom-hud">

            <!-- LEWA: (pusta - symetria siatki) -->
            <div class="bt-hud-left"></div>

            <!-- SRODEK: Roll + tura -->
            <div class="bt-hud-center" id="rollPanel">
                  <div class="bt-reaction-toolbar">
                      <button type="button" class="btn-react" onclick="sendReaction('😂')" title="Smiech">😂</button>
                      <button type="button" class="btn-react" onclick="sendReaction('😢')" title="Smutek">😢</button>
                      <button type="button" class="btn-react" onclick="sendReaction('😠')" title="Zlosc">😠</button>
                      <button type="button" class="btn-react" onclick="sendReaction('😎')" title="Cool">😎</button>
                      <!-- Miejsce na naklejke (jesli zalozona) -->
                      <th:block th:if="${equippedSticker != null}">
                          <button type="button" class="btn-react sticker-btn" 
                                  th:onclick="|sendReaction('${equippedSticker.itemSlug}')|" 
                                  th:title="${equippedSticker.itemSlug}">
                              <i th:class="${equippedStickerIcon}"></i>
                          </button>
                      </th:block>
                  </div>

                <div class="bt-turn-label-row">
                    <span id="centerHint" class="hud-badge bt-live">Rzuc!</span>
                    <h2 id="centerTurnLabel" class="bt-turn-h2">Twoja kolej</h2>
                </div>
                <button id="rollBtn" class="btn btn-bt-roll bt-roll-big" type="button">
                    <i class="fa-solid fa-dice"></i> RZUC KOSTKA
                </button>
            </div>

            <!-- PRAWA: Posesje + karty + przelew -->
            <div class="bt-hud-right">
                <!-- Panel posesji — domyslnie otwarty, toggle go chowa/pokazuje -->
                <div id="propertiesPanel" class="bt-properties-popup">
                    <div class="bt-hand-popup-header">
                        <strong>
                            <i class="fa-solid fa-city"></i> Moje posesje
                            <span id="propertiesCount" class="bt-float-badge" style="position:static;margin-left:.3rem;vertical-align:middle;"></span>
                        </strong>
                    </div>
                    <div id="propertiesList" class="bt-properties-list"></div>
                </div>

                <!-- Rzad przyciskow -->
                <div class="bt-hud-btn-row">
                    <button id="propertiesToggle" class="bt-float-icon-btn" title="Moje posesje">
                        <i class="fa-solid fa-city"></i>
                    </button>
                    <button id="handCardsToggle" class="bt-float-icon-btn" title="Twoje karty">
                        <i class="fa-solid fa-layer-group"></i>
                        <span id="handCardCount" class="bt-float-badge">0</span>
                    </button>
                    <button id="transferToggle" class="bt-float-icon-btn" title="Przelewanie">
                        <i class="fa-solid fa-money-bill-transfer"></i>
                    </button>
                </div>

                <!-- Panel kart w rece -->
                <div id="handCardsPanel" class="bt-hand-popup" style="display:none;">
                    <div class="bt-hand-popup-header">
                        <strong><i class="fa-solid fa-layer-group"></i> Twoje karty</strong>
                        <button id="handCardsClose" class="bt-popup-close"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div id="handCardsList"></div>
                    <div id="destroyTargetPanel" style="display:none;border-top:1px solid var(--border);padding:.5rem;margin-top:.4rem;">
                        <p class="muted" id="destroyTargetTitle" style="font-size:.8rem;margin:.2rem 0;">Wybierz pole rywala do przejecia:</p>
                        <select id="destroyTargetSelect" style="width:100%;margin-bottom:.4rem;"></select>
                        <div style="display:flex;gap:.4rem;">
                            <button id="destroyConfirmBtn" class="btn btn-danger btn-small">Zatwierdz</button>
                            <button id="destroyCancelBtn" class="btn btn-ghost btn-small">Anuluj</button>
                        </div>
                    </div>
                </div>

                <!-- Panel przelewania -->
                <div id="transferPanel" class="bt-transfer-popup" style="display:none;">
                    <div class="bt-hand-popup-header">
                        <strong><i class="fa-solid fa-money-bill-transfer"></i> Przelewanie</strong>
                        <button id="transferClose" class="bt-popup-close"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="field" style="margin:.4rem 0;">
                        <label for="toPlayer" style="font-size:.8rem;">Do gracza</label>
                        <select id="toPlayer" style="width:100%;"></select>
                    </div>
                    <div class="field" style="margin:.4rem 0;">
                        <label for="amount" style="font-size:.8rem;">Kwota (PLN)</label>
                        <input type="number" id="amount" min="1" value="100" style="width:100%;">
                    </div>
                    <button id="transferBtn" class="btn btn-bt btn-small" type="button" style="width:100%;">
                        Przelej
                    </button>
                    <p class="error" id="transferErr" style="display:none;font-size:.78rem;margin-top:.3rem;"></p>
                </div>
            </div>
        </div>

        <!-- hidden: online count referenced by JS -->
        <span id="onlineCount" style="display:none;">0</span>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script th:src="@{/js/GLTFLoader.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/board3d.js(v='20260615-timer')}"></script>
<script th:src="@{/js/app.js}"></script>
<div id="gameInviteToastHost"></div>
<script th:inline="javascript">window.__CURRENT_USER__ = /*[[${#authentication.name}]]*/ '';</script>
<script th:src="@{/js/game-notifications.js}"></script>
<script>
(function(){
    var btn = document.getElementById("leaveGameBtn");
    if (!btn || typeof pbConfirm !== "function") return;
    btn.addEventListener("click", function(){
        pbConfirm({
            title: "Opuścić grę?",
            message: "W trakcie rozgrywki zostaniesz oznaczony jako bankrut i stracisz szansę na wygraną w tym meczu.",
            confirmText: "Opuść grę",
            cancelText: "Zostaję",
            danger: true,
            icon: "fa-solid fa-door-open"
        }).then(function(ok){
            if (!ok) return;
            var t = document.querySelector('meta[name="_csrf"]');
            var h = document.querySelector('meta[name="_csrf_header"]');
            var headers = {};
            if (t && h) headers[h.content] = t.content;
            fetch("/game/" + document.getElementById("main").dataset.session + "/leave", {
                method: "POST",
                headers: headers
            }).then(function(){ window.location.href = "/game"; })
              .catch(function(){ window.location.href = "/game"; });
        });
    });
})();
</script>
</body>
</html>
