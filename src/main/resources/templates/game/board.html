<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Plansza')}"></head>
<body class="board-page">
<header th:replace="~{fragments/layout :: navbar}"></header>

<main id="main" class="page-wide board-main" th:attr="data-session=${sessionId}">
    <div class="board-header board-header-compact">
        <div class="board-header-left">
            <a th:href="@{/game}" class="btn btn-ghost btn-small"><i class="fa-solid fa-arrow-left"></i> Lobby</a>
            <div>
                <p class="board-room-label">Kampus PB — styl Business Tour</p>
                <h1 class="board-room-name" th:text="${sessionName}">Pokoj</h1>
            </div>
        </div>
        <div class="board-header-code">
            <span class="muted">Kod pokoju</span>
            <span class="code-chip code-chip-lg" th:text="${sessionCode}">ABC123</span>
        </div>
    </div>

    <div class="game-layout board-layout-bt">
        <div class="canvas-shell board-canvas-shell">
            <div id="game-canvas-container"></div>

            <div id="cornerPlayers" class="bt-corner-players" aria-live="polite"></div>

            <div id="diceToast" class="bt-dice-toast" aria-hidden="true">
                <span class="bt-dice-label">Rzut kostką…</span>
                <span id="diceToastSum" class="bt-dice-sum">–</span>
            </div>

            <div class="canvas-hud bt-canvas-hud">
                <span><i class="fa-solid fa-chess-board" style="color:#1565C0;margin-right:.35rem;"></i>Plansza PB — bez obrotu</span>
                <div class="bt-zoom-group">
                    <button type="button" id="zoom-in-btn" class="btn btn-bt btn-small" title="Przybliz">+</button>
                    <button type="button" id="zoom-out-btn" class="btn btn-bt btn-small" title="Oddal">−</button>
                </div>
                <span id="liveBadge" class="hud-badge bt-live">Laczenie…</span>
            </div>

            <div id="game-canvas-loader" class="canvas-loader">
                <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:#1565C0;margin-bottom:1rem;"></i>
                <span>Ladowanie Kampus PB 3D…</span>
            </div>
        </div>

        <aside class="game-hud game-hud-bt">
            <div class="hud-panel bt-panel">
                <div class="hud-panel-head">
                    <h2>Gracze</h2>
                    <span class="hud-badge bt-badge"><span id="onlineCount">0</span> online</span>
                </div>
                <div id="players"><p class="muted">Ladowanie…</p></div>
            </div>

            <div class="hud-panel bt-panel" id="tileInfoPanel">
                <div class="hud-panel-head"><h2>Aktualne pole</h2></div>
                <div id="tileInfo" class="log-box bt-log">Tura startuje na planszy Kampus PB.</div>
            </div>

            <div class="hud-panel bt-panel">
                <div class="hud-panel-head"><h2>Rzut kostka</h2></div>
                <div class="dice">
                    <div class="die bt-die" id="d1" aria-label="Kosc 1">–</div>
                    <div class="die bt-die" id="d2" aria-label="Kosc 2">–</div>
                </div>
                <button id="rollBtn" class="btn btn-roll btn-bt-roll" type="button">
                    <i class="fa-solid fa-dice"></i> Rzuc kostka
                </button>
                <div class="log-box bt-log" id="log" aria-live="polite">Czekaj na swoja ture.</div>
            </div>

            <div class="hud-panel bt-panel" id="transferPanel">
                <div class="hud-panel-head"><h2>Transfer siana</h2></div>
                <div class="field">
                    <label for="toPlayer">Do gracza</label>
                    <select id="toPlayer"></select>
                </div>
                <div class="field">
                    <label for="amount">Kwota (PLN)</label>
                    <input type="number" id="amount" min="1" value="100">
                </div>
                <button id="transferBtn" class="btn btn-bt btn-roll" type="button">Przelej siano</button>
                <p class="error" id="transferErr" style="display:none;"></p>
            </div>
        </aside>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/board3d.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
