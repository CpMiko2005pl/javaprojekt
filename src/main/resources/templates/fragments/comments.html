<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Sekcja komentarzy pod profilem. Parametry:
   comments        - lista ProfileCommentDto
   canComment      - czy zalogowany moze dodac nowy komentarz
   targetUsername  - login wlasciciela profilu (do akcji "dodaj")
   from            - sciezka powrotu (np. /dashboard lub /u/login)
   loggedIn        - czy ktokolwiek zalogowany
   ownProfile      - czy ogladajacy to wlasciciel profilu
-->
<div th:fragment="commentsSection(comments, canComment, targetUsername, from, loggedIn, ownProfile)"
     class="lp-sc pc-section">
    <div class="lp-sc-head">
        <h3><i class="fa-solid fa-comments" style="margin-right:.4rem;color:#6A1B9A;"></i> Komentarze</h3>
        <span th:text="${(comments != null ? comments.size() : 0)} + ' komentarzy'">0 komentarzy</span>
    </div>

    <p th:if="${commentMessage}" class="pc-msg ok" th:text="${commentMessage}"></p>
    <p th:if="${commentError}" class="pc-msg err" th:text="${commentError}"></p>

    <form th:if="${canComment}" class="pc-form"
          th:action="@{/u/{u}/comment(u=${targetUsername})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="from" th:value="${from}">
        <textarea name="content" maxlength="500" required
                  placeholder="Napisz komentarz pod tym profilem (1 na osobę)…"></textarea>
        <button type="submit" class="lp-btn-play"
                style="animation:none;font-size:13px;padding:8px 18px;margin-top:.5rem;">
            <i class="fa-solid fa-paper-plane"></i> Dodaj komentarz
        </button>
    </form>
    <p th:if="${loggedIn and ownProfile}" class="muted" style="font-size:.85rem;margin:0;">
        To Twój profil — zarządzaj komentarzami innych: odpowiadaj, lajkuj lub usuwaj.
    </p>
    <p th:if="${loggedIn and !ownProfile and !canComment}" class="muted" style="font-size:.85rem;margin:0;">
        Masz już komentarz pod tym profilem — możesz go edytować lub usunąć poniżej.
    </p>
    <p th:if="${!loggedIn}" class="muted" style="font-size:.85rem;margin:0;">
        <a th:href="@{/login}">Zaloguj się</a>, aby dodać komentarz.
    </p>

    <div class="pc-list">
        <div class="pc-item" th:each="c : ${comments}">
            <img class="pc-avatar" th:src="@{/api/avatar/{u}(u=${c.authorUsername})}" alt="">
            <div class="pc-body">
                <div class="pc-head">
                    <a class="pc-author" th:href="@{/u/{u}(u=${c.authorUsername})}"
                       th:text="${c.authorLabel}">Autor</a>
                    <span class="pc-date"
                          th:text="${#temporals.format(c.createdAt,'dd.MM.yyyy HH:mm')} + (${c.updatedAt != null} ? ' (edytowano)' : '')">data</span>
                </div>
                <p class="pc-text" th:text="${c.content}">treść</p>

                <!-- Odpowiedz wlasciciela profilu -->
                <div th:if="${c.reply != null}" class="pc-reply">
                    <i class="fa-solid fa-reply" style="font-size:.7rem;opacity:.6;"></i>
                    <span class="pc-reply-text" th:text="${c.reply}">odpowiedź</span>
                    <span class="pc-date" th:if="${c.replyAt != null}"
                          th:text="' · ' + ${#temporals.format(c.replyAt,'dd.MM.yyyy HH:mm')}"></span>
                </div>

                <div class="pc-actions">
                    <!-- Lajk -->
                    <form th:if="${loggedIn}" th:action="@{/comments/{id}/like(id=${c.id})}" method="post" class="inline-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="from" th:value="${from}">
                        <button type="submit" class="pc-like-btn" th:classappend="${c.likedByMe} ? ' liked' : ''"
                                th:title="${c.likedByMe} ? 'Cofnij polubienie' : 'Polub'">
                            <i class="fa-solid fa-heart"></i> <span th:text="${c.likeCount}">0</span>
                        </button>
                    </form>
                    <span th:unless="${loggedIn}" class="pc-like-static"><i class="fa-solid fa-heart"></i> <span th:text="${c.likeCount}">0</span></span>

                    <button type="button" class="btn btn-small pc-reply-btn" th:if="${c.canReply}" th:data-id="${c.id}">
                        <i class="fa-solid fa-reply"></i> Odpowiedz
                    </button>
                    <button type="button" class="btn btn-small pc-edit-btn" th:if="${c.canEdit}" th:data-id="${c.id}">Edytuj</button>
                    <form th:if="${c.canDelete}" th:action="@{/comments/{id}/delete(id=${c.id})}" method="post"
                          class="inline-form" data-pb-confirm="Usunąć komentarz?" data-pb-confirm-danger>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="from" th:value="${from}">
                        <button type="submit" class="btn btn-small btn-danger">Usuń</button>
                    </form>
                </div>

                <!-- Formularz edycji (autor) -->
                <form th:if="${c.canEdit}" class="pc-edit-form" th:id="'pc-edit-' + ${c.id}"
                      style="display:none;margin-top:.5rem;"
                      th:action="@{/comments/{id}/edit(id=${c.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="from" th:value="${from}">
                    <textarea name="content" maxlength="500" required th:text="${c.content}"></textarea>
                    <button type="submit" class="btn btn-small" style="margin-top:.4rem;">Zapisz zmiany</button>
                </form>

                <!-- Formularz odpowiedzi (wlasciciel profilu) -->
                <form th:if="${c.canReply}" class="pc-reply-form" th:id="'pc-reply-' + ${c.id}"
                      style="display:none;margin-top:.5rem;"
                      th:action="@{/comments/{id}/reply(id=${c.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="from" th:value="${from}">
                    <textarea name="content" maxlength="500" th:text="${c.reply}"
                              placeholder="Twoja odpowiedź (puste = usuń odpowiedź)…"></textarea>
                    <button type="submit" class="btn btn-small" style="margin-top:.4rem;">Zapisz odpowiedź</button>
                </form>
            </div>
        </div>
        <p th:if="${comments == null or comments.isEmpty()}" class="muted" style="margin:0;">
            Brak komentarzy.
        </p>
    </div>

    <script>
    (function(){
        function bindToggle(btnSel, prefix){
            document.querySelectorAll(btnSel).forEach(function(btn){
                btn.addEventListener('click', function(){
                    var f = document.getElementById(prefix + btn.getAttribute('data-id'));
                    if(!f) return;
                    var show = (f.style.display === 'none' || !f.style.display);
                    f.style.display = show ? 'block' : 'none';
                    if(show){ var t = f.querySelector('textarea'); if(t) t.focus(); }
                });
            });
        }
        bindToggle('.pc-edit-btn', 'pc-edit-');
        bindToggle('.pc-reply-btn', 'pc-reply-');
    })();
    </script>
</div>

</body>
</html>
