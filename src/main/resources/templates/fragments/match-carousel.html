<!-- Fragment: karuzela ostatnich meczow (max 6) -->
<th:block th:fragment="matchCarousel(matches)">
    <div class="hist-carousel-wrap" th:if="${matches != null && !matches.isEmpty()}">
        <button type="button" class="hist-carousel-btn hist-carousel-prev" aria-label="Nowsze mecze">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="hist-carousel-viewport">
            <div class="hist-carousel-track">
                <div class="lp-m-card hist-slide" th:each="m : ${matches}">
                    <span class="lp-m-result" th:classappend="${m.won} ? ' lp-m-win' : ' lp-m-loss'"
                          th:text="${m.won} ? 'WIN' : 'LOSS'">WIN</span>
                    <div class="lp-m-info">
                        <div class="lp-m-opp" th:text="${m.boardName}">Kampus PB</div>
                        <div class="lp-m-date"
                             th:text="${#temporals.format(m.playedAt, 'dd.MM.yyyy HH:mm')} + ' · ' + ${m.durationMinutes} + ' min'">01.01.2026</div>
                    </div>
                    <div class="lp-m-elo"
                         th:classappend="${m.eloChange >= 0} ? ' lp-elo-pos' : ' lp-elo-neg'"
                         th:text="(${m.eloChange >= 0} ? '+' : '') + ${m.eloChange} + ' ELO'">+20 ELO</div>
                    <div class="lp-m-place"
                         th:text="${m.placement} + '. / ' + ${m.playersCount} + ' graczy'">1. / 4 graczy</div>
                </div>
            </div>
        </div>
        <button type="button" class="hist-carousel-btn hist-carousel-next" aria-label="Starsze mecze">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>
    <p class="muted" th:if="${matches == null || matches.isEmpty()}">
        Brak rozegranych meczów. <a th:href="@{/game}">Zagraj pierwszy mecz!</a>
    </p>
</th:block>
