<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Logowanie')}"></head>
<body class="light-page">
<header th:replace="~{fragments/layout :: navbar}"></header>

<div class="lp-auth-wrap" id="main">
    <div class="lp-auth-box">

        <h1>Witaj z powrotem</h1>
        <p class="sub">Zaloguj się, aby wejść do lobby i gry.</p>

        <div class="alert alert-error" role="alert" th:if="${param.error}" style="margin-bottom:1rem;">
            Błędny login lub hasło. Spróbuj ponownie.
        </div>
        <div class="alert alert-error" role="alert" th:if="${param.locked}" style="margin-bottom:1rem;">
            Twoje konto jest zawieszone — nie możesz się zalogować ani grać.
            Skontaktuj się z moderatorem.
        </div>
        <div class="alert alert-success" role="status" th:if="${registered}" style="margin-bottom:1rem;">
            Konto zostało utworzone. Możesz się zalogować.
        </div>

        <div class="lp-auth-card">
            <form th:action="@{/login}" method="post">
                <div class="field">
                    <label for="username">Login</label>
                    <input type="text" id="username" name="username" required autofocus
                           autocomplete="username" placeholder="Twój login">
                </div>
                <div class="field">
                    <label for="password">Hasło</label>
                    <input type="password" id="password" name="password" required
                           autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="lp-btn-play lp-auth-submit" style="animation:none;">
                    <i class="fa-solid fa-right-to-bracket"></i> Zaloguj się
                </button>
            </form>
            <p class="lp-auth-link">Nie masz konta? <a th:href="@{/register}">Zarejestruj się</a></p>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: lp-footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
