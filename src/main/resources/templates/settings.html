<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Ustawienia profilu')}"></head>
<body class="light-page">
<header th:replace="~{fragments/layout :: navbar}"></header>

<div class="lp-faceit" id="main" style="max-width:760px;">

    <div class="alert alert-success" th:if="${message}" th:text="${message}" style="margin-bottom:16px;"></div>
    <div class="alert alert-error"   th:if="${error}"   th:text="${error}"   style="margin-bottom:16px;"></div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
        <a th:href="@{/dashboard}" class="lp-btn-outline" style="font-size:13px;padding:8px 14px;">
            <i class="fa-solid fa-arrow-left"></i> Wróć do profilu
        </a>
        <h1 style="margin:0;font-size:1.4rem;font-family:var(--font-display);color:#0f172a;">Ustawienia konta</h1>
    </div>

    <!-- Dane profilu -->
    <div class="lp-sc" style="margin-bottom:18px;">
        <div class="lp-sc-head">
            <h3><i class="fa-solid fa-user-pen" style="color:#00A651;margin-right:.4rem;"></i> Dane profilu</h3>
        </div>
        <form th:action="@{/settings/profile}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <!-- Awatar -->
            <div class="field">
                <label for="avatarUrl">URL awatara <span style="color:#94a3b8;font-size:.78rem;">(opcjonalne — link do zdjęcia profilowego)</span></label>
                <div style="display:flex;align-items:center;gap:14px;margin-bottom:.5rem;">
                    <div id="avatarPreviewWrap" style="width:72px;height:72px;border-radius:16px;overflow:hidden;border:3px solid rgba(0,166,81,.3);flex-shrink:0;background:var(--lp-gr);display:grid;place-items:center;">
                        <img th:if="${user.avatarUrl != null and !#strings.isEmpty(user.avatarUrl)}"
                             th:src="${user.avatarUrl}" id="avatarPreviewImg"
                             alt="Podgląd awatara" style="width:100%;height:100%;object-fit:cover;"
                             onerror="this.style.display='none'">
                        <img th:unless="${user.avatarUrl != null and !#strings.isEmpty(user.avatarUrl)}"
                             th:src="@{/api/avatar/{u}(u=${user.username})}" id="avatarPreviewImg"
                             alt="Aktualny awatar" style="width:100%;height:100%;object-fit:cover;">
                    </div>
                    <input type="url" id="avatarUrl" name="avatarUrl"
                           th:value="${user.avatarUrl}"
                           placeholder="https://example.com/avatar.jpg"
                           style="flex:1;">
                </div>
                <small style="color:#94a3b8;font-size:.75rem;">Zostaw puste aby użyć automatycznie generowanego awatara z ekwipunku.</small>
            </div>

            <!-- Baner -->
            <div class="field">
                <label for="bannerUrl">URL banera profilu <span style="color:#94a3b8;font-size:.78rem;">(proporcja ok. 5.7:1, np. 1920×336 px)</span></label>
                <input type="url" id="bannerUrl" name="bannerUrl"
                       th:value="${user.bannerUrl}"
                       placeholder="https://example.com/banner.jpg">
            </div>
            <div th:if="${user.bannerUrl != null and !#strings.isEmpty(user.bannerUrl)}"
                 style="margin-bottom:1rem;border-radius:12px;overflow:hidden;aspect-ratio:1920/336;">
                <img th:src="${user.bannerUrl}" alt="Podgląd banera"
                     style="width:100%;height:100%;object-fit:cover;"
                     onerror="this.parentElement.style.display='none'">
            </div>

            <div class="field">
                <label for="email">Adres e-mail</label>
                <input type="email" id="email" name="email" th:value="${user.email}"
                       required placeholder="twoj@email.com">
            </div>
            <div class="field">
                <label for="bio">Opis profilu <span style="color:#94a3b8;font-size:.78rem;">(maks. 200 znaków)</span></label>
                <textarea id="bio" name="bio" maxlength="200"
                          placeholder="Napisz coś o sobie…"
                          style="width:100%;padding:.75rem .85rem;border-radius:12px;border:1px solid rgba(0,166,81,.18);background:rgba(255,255,255,.88);color:#0f172a;font-size:.95rem;resize:vertical;min-height:80px;font-family:inherit;"
                          th:text="${user.bio}"></textarea>
            </div>

            <button type="submit" class="lp-btn-play" style="animation:none;font-size:14px;padding:10px 24px;">
                <i class="fa-solid fa-floppy-disk"></i> Zapisz zmiany
            </button>
        </form>
    </div>

    <!-- Zmiana hasła -->
    <div class="lp-sc">
        <div class="lp-sc-head">
            <h3><i class="fa-solid fa-lock" style="color:#6A1B9A;margin-right:.4rem;"></i> Zmiana hasła</h3>
        </div>
        <form th:action="@{/settings/password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="currentPassword">Aktualne hasło</label>
                <input type="password" id="currentPassword" name="currentPassword"
                       required placeholder="••••••••" autocomplete="current-password">
            </div>
            <div class="field">
                <label for="newPassword">Nowe hasło <span style="color:#94a3b8;font-size:.78rem;">(min. 6 znaków)</span></label>
                <input type="password" id="newPassword" name="newPassword"
                       required minlength="6" placeholder="••••••••" autocomplete="new-password">
            </div>
            <div class="field">
                <label for="confirmPassword">Potwierdź nowe hasło</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       required minlength="6" placeholder="••••••••" autocomplete="new-password">
            </div>
            <button type="submit" class="lp-btn-outline" style="font-size:14px;padding:10px 24px;">
                <i class="fa-solid fa-key"></i> Zmień hasło
            </button>
        </form>
    </div>

</div>

<footer th:replace="~{fragments/layout :: lp-footer}"></footer>
<script th:src="@{/js/app.js}"></script>
<script>
(function(){
    var inp = document.getElementById('avatarUrl');
    var img = document.getElementById('avatarPreviewImg');
    if (!inp || !img) return;
    inp.addEventListener('input', function(){
        var val = inp.value.trim();
        if (val) {
            img.src = val;
            img.style.display = '';
            img.onerror = function(){ img.style.display='none'; };
        } else {
            img.src = img.getAttribute('data-default') || img.src;
        }
    });
})();
</script>
</body>
</html>
