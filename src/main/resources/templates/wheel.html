<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kolo Fortuny')}"></head>
<body class="light-page">
<header th:replace="~{fragments/layout :: navbar}"></header>

<main id="main">
    <div class="page-header">
        <span class="section-kicker"><i class="fa-solid fa-dharmachakra"></i> Codzienny bonus</span>
        <h1>Kolo Fortuny Stypendialnego</h1>
        <p class="lead">Zakrec raz dziennie i buduj Daily Streak. Nagrody ulatwiaja rozgrywke na planszy.</p>
    </div>

    <div class="panel" style="max-width:560px; margin:0 auto;">
        <div class="wheel-wrap">
            <div class="wheel-pointer" aria-hidden="true"></div>
            <canvas id="wheel" width="440" height="440" role="img"
                    aria-label="Kolo Fortuny z nagrodami do wylosowania"></canvas>
        </div>

        <div class="reward-banner" id="reward" aria-live="polite"></div>

        <div style="text-align:center; margin-top:1rem;">
            <button id="spinBtn" class="btn" type="button">Zakrec kolem</button>
            <p class="muted" id="spinInfo" style="margin-top:.6rem;"></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
    window.WHEEL_SEGMENTS = /*[[${segments}]]*/ ["Nagroda"];
    window.CAN_SPIN = /*[[${canSpin}]]*/ true;
</script>
<script th:src="@{/js/wheel.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
