<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profil publiczny')}"></head>
<body class="light-page">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main">

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div th:if="${profileUser != null}">
        <div class="page-header">
            <span class="section-kicker"><i class="fa-solid fa-user"></i> Profil publiczny</span>
            <h1 th:text="${profileUser.username}">gracz</h1>
        </div>

        <section class="profile-header">
            <img th:src="@{/api/avatar/{u}(u=${profileUser.username})}" alt="Awatar"
                 class="avatar-img" width="64" height="64" loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="avatar" style="display:none"
                 th:text="${#strings.toUpperCase(#strings.substring(profileUser.username,0,1))}">G</div>
            <div>
                <h2 style="margin:.2rem 0;" th:text="${profileUser.username}">gracz</h2>
                <p class="muted" th:text="${profileUser.firstName} + ' ' + ${profileUser.lastName}">Imie</p>
                <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem;">
                    <span class="level-badge" th:if="${stats != null}">LVL <span th:text="${stats.level}">1</span></span>
                    <span class="elo-pill" th:if="${stats != null}"><i class="fa-solid fa-bolt"></i> <span th:text="${stats.eloPoints}">1000</span> ELO</span>
                    <span th:if="${profileUser.verified}" class="badge badge-ok">zweryfikowany</span>
                </div>
            </div>
        </section>

        <section class="stat-grid" th:if="${stats != null}">
            <div class="stat"><div class="value" th:text="${stats.gamesPlayed}">0</div><div class="label">Rozegrane mecze</div></div>
            <div class="stat"><div class="value win" th:text="${stats.gamesWon}">0</div><div class="label">Wygrane</div></div>
            <div class="stat"><div class="value gold" th:text="${stats.winRate} + '%'">0%</div><div class="label">Win rate</div></div>
            <div class="stat"><div class="value" th:text="${stats.winStreak}">0</div><div class="label">Seria zwyciestw</div></div>
        </section>

        <h2 style="margin-top:1.5rem;">Historia meczow</h2>
        <table>
            <caption class="sr-only">Historia rozegranych meczow</caption>
            <thead>
            <tr>
                <th scope="col">Data</th><th scope="col">Wynik</th>
                <th scope="col">Miejsce</th><th scope="col">Graczy</th>
                <th scope="col">Siano</th><th scope="col">ELO</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${matches}">
                <td th:text="${#temporals.format(m.playedAt,'dd.MM.yyyy')}">-</td>
                <td><span th:if="${m.won}" class="result-w">WYGRANA</span>
                    <span th:unless="${m.won}" class="result-l">PRZEGRANA</span></td>
                <td th:text="${m.placement} + '/' + ${m.playersCount}">-</td>
                <td th:text="${m.playersCount}">-</td>
                <td th:text="${m.finalCash} + ' PLN'">-</td>
                <td><span th:class="${m.eloChange >= 0} ? 'elo-up' : 'elo-down'"
                          th:text="(${m.eloChange >= 0} ? '+' : '') + ${m.eloChange}">+0</span></td>
            </tr>
            <tr th:if="${matches.isEmpty()}">
                <td colspan="6" class="muted">Brak rozegranych meczow.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
