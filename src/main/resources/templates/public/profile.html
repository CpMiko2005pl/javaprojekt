<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profil gracza')}"></head>
<body class="light-page"
      th:classappend="${profileUser != null and profileUser.profileBgUrl != null and !#strings.isEmpty(profileUser.profileBgUrl)} ? ' has-profile-bg' : ''">
<header th:replace="~{fragments/layout :: navbar}"></header>

<style>
/* Tlo calego profilu (styl Steam) — body musi byc przezroczyste, by tlo bylo widoczne */
body.has-profile-bg.light-page, body.has-profile-bg { background: transparent !important; }
.profile-bg { position:fixed; inset:0; z-index:-2; background-size:cover; background-position:center center; }
.profile-bg-overlay { position:fixed; inset:0; z-index:-1;
    background:linear-gradient(180deg, rgba(238,245,242,.72), rgba(238,245,242,.90)); }
html.pb-dark .profile-bg-overlay { background:linear-gradient(180deg, rgba(8,12,20,.78), rgba(8,12,20,.92)); }
</style>

<div th:if="${profileUser != null and profileUser.profileBgUrl != null and !#strings.isEmpty(profileUser.profileBgUrl)}"
     class="profile-bg" th:style="'background-image:url(' + ${profileUser.profileBgUrl} + ')'"></div>
<div th:if="${profileUser != null and profileUser.profileBgUrl != null and !#strings.isEmpty(profileUser.profileBgUrl)}"
     class="profile-bg-overlay"></div>

<div class="lp-faceit" id="main">

    <div th:if="${error}" class="alert alert-error" th:text="${error}" style="margin-bottom:16px;"></div>

    <div th:if="${profileUser != null}">

        <button type="button" class="page-back-link" id="profileBackBtn" style="background:none;border:none;padding:0;cursor:pointer;font:inherit;">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Wstecz
        </button>

        <!-- PROFILE HEADER (FACEIT style) -->
        <div class="lp-ph" style="margin-bottom:24px;">
            <div class="lp-ph-banner">
                <img th:if="${profileUser.bannerUrl != null and !#strings.isEmpty(profileUser.bannerUrl)}"
                     th:src="${profileUser.bannerUrl}" alt="Banner profilu" class="lp-ph-banner-img"
                     onerror="this.style.display='none'">
            </div>
            <div class="lp-ph-row">
                <div class="lp-ph-identity">
                    <div class="lp-ph-avatar profile-avatar-frame">
                        <img th:src="@{/api/avatar/{u}(u=${profileUser.username})}" alt="Awatar"
                             width="120" height="120" loading="lazy"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                        <span style="display:none;font-family:var(--font-display);font-size:48px;font-weight:800;color:#fff;"
                              th:text="${#strings.toUpperCase(#strings.substring(profileUser.username,0,1))}">G</span>
                    </div>
                    <div class="lp-ph-details">
                        <h2 class="player-name-row">
                            <span class="presence-dot-inline"
                                  th:classappend="${profileOnline} ? ' presence-dot-inline--online' : ' presence-dot-inline--offline'"
                                  th:title="${profileOnline} ? 'Online' : 'Offline'"></span>
                            <span th:text="${profileUser.username}">gracz</span>
                        </h2>
                        <p class="lp-role">
                            <span th:text="${profileUser.role.displayName}">Rola</span>
                            <span class="muted" style="font-size:.8rem;margin-left:.5rem;"
                                  th:text="${profileOnline} ? '· Online' : '· Offline'">· Offline</span>
                        </p>
                        <p th:if="${profileUser.bio != null and !#strings.isEmpty(profileUser.bio)}"
                           style="font-size:.83rem;color:#475569;margin:3px 0 0;max-width:400px;"
                           th:text="${profileUser.bio}"></p>
                        <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem;">
                            <span class="level-badge" th:if="${stats != null}">LVL <span th:text="${stats.level}">1</span></span>
                            <span class="elo-pill" th:if="${stats != null}"><i class="fa-solid fa-bolt"></i> <span th:text="${stats.eloPoints}">1000</span> ELO</span>
                            <span th:if="${profileUser.verified}" class="badge badge-ok">zweryfikowany</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTENT GRID -->
        <div class="lp-pg">
            <!-- SIDEBAR: statystyki -->
            <aside class="lp-sidebar">
                <div class="lp-stat-panel" th:if="${stats != null}">
                    <div class="lp-s-row">
                        <span class="lp-s-lbl">ELO</span>
                        <span class="lp-s-val green" th:text="${stats.eloPoints}">1000</span>
                    </div>
                    <div class="lp-s-row">
                        <span class="lp-s-lbl">Mecze</span>
                        <span class="lp-s-val" th:text="${stats.gamesPlayed}">0</span>
                    </div>
                    <div class="lp-s-row">
                        <span class="lp-s-lbl">Wygrane</span>
                        <span class="lp-s-val green" th:text="${stats.gamesWon}">0</span>
                    </div>
                    <div class="lp-s-row">
                        <span class="lp-s-lbl">Win rate</span>
                        <span class="lp-s-val" th:text="${stats.winRate} + '%'">0%</span>
                    </div>
                    <div class="lp-s-row">
                        <span class="lp-s-lbl">Seria zwyciestw</span>
                        <span class="lp-s-val" th:text="${stats.winStreak}">0</span>
                    </div>
                </div>
                <div class="lp-mini-panel" th:if="${stats == null}">
                    <p class="muted" style="margin:0;font-size:.85rem;">Brak statystyk.</p>
                </div>
            </aside>

            <!-- MAIN: historia meczów -->
            <div class="lp-main">
                <div class="lp-sc">
                    <div class="lp-sc-head">
                        <h3>Historia meczów</h3>
                        <span th:text="${matches.size()} + ' meczy'">0 meczy</span>
                    </div>
                    <div class="lp-match-list" th:if="${!matches.isEmpty()}">
                        <div class="lp-m-card" th:each="m : ${matches}">
                            <span class="lp-m-result" th:classappend="${m.won} ? ' lp-m-win' : ' lp-m-loss'"
                                  th:text="${m.won} ? 'WIN' : 'LOSS'">WIN</span>
                            <div class="lp-m-info">
                                <div class="lp-m-opp" th:text="${m.boardName}">Kampus PB</div>
                                <div class="lp-m-date" th:text="${#temporals.format(m.playedAt,'dd.MM.yyyy HH:mm')} + ' · ' + ${m.durationMinutes} + ' min'">01.01.2026</div>
                            </div>
                            <div class="lp-m-elo"
                                 th:classappend="${m.eloChange >= 0} ? ' lp-elo-pos' : ' lp-elo-neg'"
                                 th:text="(${m.eloChange >= 0} ? '+' : '') + ${m.eloChange} + ' ELO'">+20 ELO</div>
                            <div class="lp-m-place"
                                 th:text="${m.placement} + '. / ' + ${m.playersCount} + ' graczy'">1. / 4 graczy</div>
                        </div>
                    </div>
                    <p class="muted" th:if="${matches.isEmpty()}" style="margin:0;">
                        Brak rozegranych meczów.
                    </p>
                </div>

                <!-- KOMENTARZE POD PROFILEM -->
                <div th:replace="~{fragments/comments :: commentsSection(${comments}, ${canComment}, ${commentTargetUsername}, ${commentFrom}, ${loggedIn}, ${ownProfile})}"></div>
            </div>
        </div>

    </div>
</div>

<footer th:replace="~{fragments/layout :: lp-footer}"></footer>
<script th:src="@{/js/app.js}"></script>
<script>
(function(){
    var btn = document.getElementById('profileBackBtn');
    if (!btn) return;
    btn.addEventListener('click', function(){
        if (document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
            history.back();
        } else {
            window.location.href = '/friends';
        }
    });
})();
/* Komentarze: przelaczanie inline formularza edycji */
(function(){
    document.querySelectorAll('.pc-edit-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
            var form = document.getElementById('pc-edit-' + btn.getAttribute('data-id'));
            if (!form) return;
            var show = form.style.display === 'none' || !form.style.display;
            form.style.display = show ? 'block' : 'none';
            if (show) { var ta = form.querySelector('textarea'); if (ta) ta.focus(); }
        });
    });
})();
</script>
</body>
</html>
