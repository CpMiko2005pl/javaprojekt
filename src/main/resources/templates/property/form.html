<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nieruchomosc - formularz')}"></head>
<body class="light-page">
<header th:replace="~{fragments/layout :: navbar}"></header>

<main id="main">
    <div class="page-header">
        <span class="section-kicker"><i class="fa-solid fa-pen"></i> Formularz CRUD</span>
        <h1 th:text="${property.id == null} ? 'Nowa nieruchomosc' : 'Edycja nieruchomosci'">Formularz</h1>
    </div>

    <form class="form-card" th:action="@{/properties/save}" th:object="${property}" method="post" novalidate>
        <!-- Przy edycji przekazujemy id ukrytym polem -->
        <input type="hidden" th:field="*{id}">

        <div class="field">
            <label for="name">Nazwa *</label>
            <input type="text" id="name" th:field="*{name}"
                   th:attr="aria-invalid=${#fields.hasErrors('name')} ? 'true' : 'false'"
                   aria-describedby="name-err">
            <p class="error" id="name-err" role="alert"
               th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Blad</p>
        </div>

        <div class="field">
            <label for="location">Lokalizacja *</label>
            <input type="text" id="location" th:field="*{location}"
                   th:attr="aria-invalid=${#fields.hasErrors('location')} ? 'true' : 'false'"
                   aria-describedby="location-err">
            <p class="error" id="location-err" role="alert"
               th:if="${#fields.hasErrors('location')}" th:errors="*{location}">Blad</p>
        </div>

        <div class="field">
            <label for="price">Cena (PLN) *</label>
            <input type="number" step="0.01" id="price" th:field="*{price}"
                   th:attr="aria-invalid=${#fields.hasErrors('price')} ? 'true' : 'false'"
                   aria-describedby="price-err">
            <p class="error" id="price-err" role="alert"
               th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Blad</p>
        </div>

        <div class="field">
            <label for="rent">Czynsz (PLN) *</label>
            <input type="number" step="0.01" id="rent" th:field="*{rent}"
                   th:attr="aria-invalid=${#fields.hasErrors('rent')} ? 'true' : 'false'"
                   aria-describedby="rent-err">
            <p class="error" id="rent-err" role="alert"
               th:if="${#fields.hasErrors('rent')}" th:errors="*{rent}">Blad</p>
        </div>

        <div class="field">
            <label for="colorGroup">Grupa kolorow</label>
            <input type="text" id="colorGroup" th:field="*{colorGroup}"
                   aria-describedby="color-err">
            <p class="error" id="color-err" role="alert"
               th:if="${#fields.hasErrors('colorGroup')}" th:errors="*{colorGroup}">Blad</p>
        </div>

        <div class="field">
            <label for="houses">Liczba domkow (0-4, 5 = hotel)</label>
            <input type="number" id="houses" th:field="*{houses}" min="0" max="5"
                   aria-describedby="houses-err">
            <p class="error" id="houses-err" role="alert"
               th:if="${#fields.hasErrors('houses')}" th:errors="*{houses}">Blad</p>
        </div>

        <button type="submit" class="btn">Zapisz</button>
        <a th:href="@{/properties}" class="btn btn-secondary">Anuluj</a>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
