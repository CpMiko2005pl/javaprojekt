<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rejestracja')}"></head>
<body class="light-page">
<header th:replace="~{fragments/layout :: navbar}"></header>

<div class="lp-auth-wrap" id="main">
    <div class="lp-auth-box" style="max-width:480px;">

        <h1>Dołącz do rozgrywki</h1>
        <p class="sub">Pola oznaczone * są wymagane.</p>

        <div class="lp-auth-card">
            <form th:action="@{/register}" th:object="${form}" method="post" novalidate>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;">
                    <div class="field">
                        <label for="firstName">Imię</label>
                        <input type="text" id="firstName" th:field="*{firstName}"
                               th:attr="aria-invalid=${#fields.hasErrors('firstName')} ? 'true' : 'false'"
                               placeholder="Jan">
                        <p class="error" role="alert" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                    </div>
                    <div class="field">
                        <label for="lastName">Nazwisko</label>
                        <input type="text" id="lastName" th:field="*{lastName}"
                               th:attr="aria-invalid=${#fields.hasErrors('lastName')} ? 'true' : 'false'"
                               placeholder="Kowalski">
                        <p class="error" role="alert" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                    </div>
                </div>

                <div class="field">
                    <label for="username">Login *</label>
                    <input type="text" id="username" th:field="*{username}"
                           th:attr="aria-invalid=${#fields.hasErrors('username')} ? 'true' : 'false'"
                           autocomplete="username" placeholder="3–20 znaków, małe litery i cyfry">
                    <p class="error" role="alert" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                </div>

                <div class="field">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" th:field="*{email}"
                           th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true' : 'false'"
                           autocomplete="email" placeholder="adres@email.pl">
                    <p class="error" role="alert" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div class="field">
                    <label for="age">Wiek * <small style="font-weight:400;color:#94a3b8;">(min. 18 lat)</small></label>
                    <input type="number" id="age" th:field="*{age}" min="18" max="120"
                           th:attr="aria-invalid=${#fields.hasErrors('age')} ? 'true' : 'false'"
                           placeholder="np. 21">
                    <p class="error" role="alert" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></p>
                </div>

                <div class="field">
                    <label for="password">Hasło * <small style="font-weight:400;color:#94a3b8;">(min. 5 zn.)</small></label>
                    <input type="password" id="password" th:field="*{password}"
                           th:attr="aria-invalid=${#fields.hasErrors('password')} ? 'true' : 'false'"
                           autocomplete="new-password" placeholder="••••••">
                    <p class="error" role="alert" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>

                <div class="field">
                    <label for="confirmPassword">Powtórz hasło *</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')} ? 'true' : 'false'"
                           autocomplete="new-password" placeholder="••••••">
                    <p class="error" role="alert" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                </div>

                <button type="submit" class="lp-btn-play lp-auth-submit" style="animation:none;">
                    <i class="fa-solid fa-user-plus"></i> Zarejestruj się
                </button>
            </form>
            <p class="lp-auth-link">Masz już konto? <a th:href="@{/login}">Zaloguj się</a></p>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: lp-footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
