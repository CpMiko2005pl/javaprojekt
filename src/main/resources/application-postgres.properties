# Domyslnie laczymy sie z lokalnym PostgreSQL, baza "monopoly".
# Dane logowania mozna nadpisac zmiennymi srodowiskowymi (bezpieczniej niz w pliku).
# === Neon PostgreSQL (cloud) ===
spring.datasource.url=jdbc:postgresql://ep-damp-fire-alzendby-pooler.c-3.eu-central-1.aws.neon.tech/neondb?sslmode=require&currentSchema=monopoly
spring.datasource.username=neondb_owner
spring.datasource.password=npg_tH0VgdZhBk8u
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate tworzy/aktualizuje tabele wg encji przy starcie
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Domyslny schemat — wszystkie tabele trafiaja do monopoly.*
spring.jpa.properties.hibernate.default_schema=monopoly

# Konsola H2 niepotrzebna
spring.h2.console.enabled=false
