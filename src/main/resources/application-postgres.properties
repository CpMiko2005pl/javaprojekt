# =====================================================================
#  Profil PostgreSQL - docelowa baza danych
#  Uruchom:  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#  (lub ustaw spring.profiles.active=postgres w application.properties)
#
#  WYMAGANE WCZESNIEJ: utworzenie bazy i uzytkownika - patrz db/postgres-setup.sql
# =====================================================================

# Domyslnie laczymy sie z lokalnym PostgreSQL, baza "monopoly".
# Dane logowania mozna nadpisac zmiennymi srodowiskowymi (bezpieczniej niz w pliku).
spring.datasource.url=jdbc:postgresql://localhost:5432/monopoly
spring.datasource.username=${DB_USER:monopoly}
spring.datasource.password=${DB_PASSWORD:monopoly}
spring.datasource.driver-class-name=org.postgresql.Driver

# update -> Hibernate utworzy/zaktualizuje tabele wg encji (wygodne na etapie nauki).
# Na produkcji rozwaz 'validate' + migracje (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Konsola H2 niepotrzebna przy PostgreSQL
spring.h2.console.enabled=false
