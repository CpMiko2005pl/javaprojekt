# =====================================================================
#  Profil H2 - baza w pamieci (development / pierwsza prezentacja)
#  Uruchom:  mvn spring-boot:run        (profil h2 jest domyslny)
#  Konsola H2: http://localhost:8080/h2-console
#     JDBC URL: jdbc:h2:mem:monopoly   user: sa   (puste haslo)
# =====================================================================

spring.datasource.url=jdbc:h2:mem:monopoly;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate samodzielnie tworzy schemat tabel przy starcie
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Konsola WWW bazy H2 (tylko development)
spring.h2.console.enabled=true
