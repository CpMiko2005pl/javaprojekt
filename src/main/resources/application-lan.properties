# Profil LAN — serwer gry online (np. 192.168.100.48:8080)
# Uruchom: java -jar app.jar --spring.profiles.active=lan

server.address=0.0.0.0
server.port=8080
server.forward-headers-strategy=framework

# Ta sama baza PostgreSQL (Neon) co localhost — jedna baza dla wszystkich
spring.config.import=classpath:application-postgres.properties

# Produkcja LAN — cache widokow wlaczony
spring.thymeleaf.cache=true
spring.jpa.show-sql=false

# Pliki statyczne (awatary, banery) — Spring serwuje z ./data/uploads/ pod /media/**
app.public-base-url=https://bruising-lizard-deflector.ngrok-free.dev
app.media.public-base-url=https://bruising-lizard-deflector.ngrok-free.dev/media
app.media.hint=JPG, PNG, WEBP lub GIF. Awatar do 5 MB, baner do 10 MB (zalecane 1920×336 px).
