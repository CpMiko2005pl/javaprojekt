# Profil LAN — serwer gry online (np. 192.168.100.48:8080)
# Uruchom: java -jar app.jar --spring.profiles.active=lan

server.address=0.0.0.0
server.port=8080
server.forward-headers-strategy=framework

# H2 na dysku — dane przetrwaja restart serwera
spring.datasource.url=jdbc:h2:file:./data/monopoly;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

# Produkcja LAN — cache widokow wlaczony
spring.thymeleaf.cache=true
spring.jpa.show-sql=false
