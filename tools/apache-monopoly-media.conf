# Apache — serwowanie plikow gry (awatary, banery)
# Skopiuj do /etc/apache2/conf-available/ i: sudo a2enconf monopoly-media && sudo systemctl reload apache2
# Wymaga: sudo apt install apache2

Alias /media /home/miko/monopoly/data/uploads
<Directory /home/miko/monopoly/data/uploads>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Opcjonalnie: reverse proxy do Spring Boot (jesli Apache ma byc frontem na :80)
# ProxyPass / http://127.0.0.1:8080/
# ProxyPassReverse / http://127.0.0.1:8080/
# ProxyPass /media !
# ( /media obsluguje Apache bezposrednio z uploads/ )
